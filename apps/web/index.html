<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0d0a08" />
        <meta name="description" content="CatCup Tavern — a local-first AI roleplay client for web, LAN and desktop." />
        <title>CatCup Tavern</title>
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
            Preload the two faces the first paint needs. Without this the
            browser discovers them from the stylesheet, so the first frame
            renders in the fallback and swaps — which on this app means the
            brand and every dialog title visibly change font after load.
        -->
        <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
