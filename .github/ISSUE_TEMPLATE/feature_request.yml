name: Feature request
description: Suggest a capability or a SillyTavern behaviour CatCup does not have yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Check [LIMITATIONS.md](https://github.com/BerryUIKI/CatCup-Tavern/blob/dev/docs/LIMITATIONS.md) and [MILESTONES.md](https://github.com/BerryUIKI/CatCup-Tavern/blob/dev/docs/MILESTONES.md) first — the missing feature may already be planned.
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: Describe the task, not the implementation. What do you do today instead?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What would you like to see?
          description: The behaviour you expect. If SillyTavern does it, say how, since compatibility is a hard constraint.
      validations:
          required: true
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Chat and generation
              - Group chats
              - Characters and library
              - World info and prompts
              - Memory, speech or images
              - Desktop app
              - Web or LAN deployment
              - Other
      validations:
          required: true
    - type: checkboxes
      id: checks
      attributes:
          label: Checklist
          options:
              - label: I searched the open issues for an existing request.
                required: true
              - label: This is within scope for a SillyTavern-compatible single-user client.
                required: false
