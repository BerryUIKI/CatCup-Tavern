name: CI

on:
    # Trunk-based: pull requests target `main`, and every push to it is the
    # trunk moving. There is no integration branch.
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Typecheck, lint, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            # `pnpm build` proves the bundle compiles, not that it runs. A
            # workspace package that exports TypeScript source and is missing
            # from tsup's `noExternal` list compiles cleanly and then throws on
            # the first import at startup, which no gate here caught until the
            # 0.4.0 release preparation started the built server by hand.
            - name: Start the built server
              run: |
                  set -euo pipefail
                  log="$RUNNER_TEMP/server.log"
                  CATCUP_PORT=0 CATCUP_DATA_DIR="$RUNNER_TEMP/data" \
                      node apps/server/dist/index.js >"$log" 2>&1 &
                  pid=$!
                  for _ in $(seq 1 60); do
                      if [ -f "$log" ] && grep -q '^CATCUP_READY ' "$log"; then
                          echo "Server reported ready:"
                          grep '^CATCUP_READY ' "$log"
                          kill "$pid"
                          exit 0
                      fi
                      if ! kill -0 "$pid" 2>/dev/null; then
                          break
                      fi
                      sleep 1
                  done
                  echo "The built server did not start." >&2
                  if [ -f "$log" ]; then cat "$log" >&2; fi
                  kill "$pid" 2>/dev/null || true
                  exit 1

    desktop:
        name: Desktop shell (${{ matrix.os }})
        strategy:
            # One platform failing should not hide the other two.
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Install Linux build dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri -> target

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `cargo check` runs the Tauri build script, which copies the
            # server bundle, the SPA and the Node sidecar next to the binary.
            # They have to exist first; a placeholder would only prove that a
            # placeholder compiles.
            - name: Build the server for bundling
              run: pnpm --filter @catcup/server build
              env:
                  CATCUP_BUNDLE_DEPS: "1"

            - name: Build the SPA
              run: pnpm --filter @catcup/web build

            - name: Prepare the desktop bundle
              run: pnpm --filter @catcup/desktop bundle

            - name: Check the shell
              run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
