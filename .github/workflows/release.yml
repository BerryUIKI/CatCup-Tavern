name: Release

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to build and publish (for example v0.2.1)
                required: true
                type: string

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    prepare:
        name: Resolve the release version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}
            ref: ${{ steps.version.outputs.ref }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Decide whether this push is a release
              id: version
              shell: bash
              run: |
                  if [ -n "${{ inputs.tag }}" ]; then
                      # A manual run names the existing tag to rebuild.
                      tag="${{ inputs.tag }}"
                      ref="$tag"
                  elif [ "${{ github.ref_type }}" = "tag" ]; then
                      tag="${{ github.ref_name }}"
                      ref="$tag"
                  else
                      # A push to main releases only when package.json holds a
                      # version that has no tag yet. Ordinary merges into main
                      # after a release are skipped, so the workflow stays quiet.
                      version=$(node -p "require('./package.json').version")
                      tag="v${version}"
                      if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                          echo "No release: tag ${tag} already exists." >> "$GITHUB_STEP_SUMMARY"
                          exit 0
                      fi
                      ref="${{ github.sha }}"
                  fi
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
                  echo "ref=${ref}" >> "$GITHUB_OUTPUT"
                  echo "Releasing ${tag}." >> "$GITHUB_STEP_SUMMARY"

    windows:
        name: Build and publish the Windows installer
        needs: prepare
        if: needs.prepare.outputs.tag != ''
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - name: Check out the release commit
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.ref }}
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri -> target

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the server for bundling
              run: pnpm --filter @catcup/server build
              env:
                  CATCUP_BUNDLE_DEPS: "1"

            - name: Build the SPA
              run: pnpm --filter @catcup/web build

            - name: Build the installer
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  pnpm --filter @catcup/desktop bundle
                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
                      # Signed artifacts are what makes this release installable
                      # as an update; without them the app can only be upgraded
                      # by downloading the installer by hand.
                      pnpm --filter @catcup/desktop exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
                  else
                      echo "TAURI_SIGNING_PRIVATE_KEY is not set, so no updater artifacts were produced and this release will not be offered as an update." >> "$GITHUB_STEP_SUMMARY"
                      pnpm --filter @catcup/desktop exec tauri build
                  fi

            - name: Write release notes
              shell: bash
              run: |
                  version="${{ needs.prepare.outputs.version }}"
                  if ! grep -q "^## ${version} " CHANGELOG.md; then
                      echo "CHANGELOG.md has no '## ${version}' section. Add one before tagging." >&2
                      exit 1
                  fi
                  awk -v heading="## ${version} " '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
                  {
                      printf 'Early-access release. Moves your SillyTavern data in and handles single-character and group roleplay end to end. '
                      printf 'The Windows installer is unsigned, and [what works and what does not](https://github.com/%s/blob/main/docs/LIMITATIONS.md) says exactly where the line is.\n\n' "$GITHUB_REPOSITORY"
                      cat "$RUNNER_TEMP/section.md"
                  } > "$RUNNER_TEMP/release-notes.md"

            - name: Create the tag
              shell: bash
              run: |
                  # Pushes to main have no tag yet; create it on the commit being
                  # released, so the tag and the assets always match.
                  tag="${{ needs.prepare.outputs.tag }}"
                  if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag -a "$tag" -m "CatCup Tavern ${tag#v}"
                      git push origin "refs/tags/${tag}"
                  fi

            - name: Publish the release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${{ needs.prepare.outputs.tag }}"
                  version="${{ needs.prepare.outputs.version }}"
                  bundle="apps/desktop/src-tauri/target/release/bundle/nsis"
                  title="CatCup Tavern ${version}"

                  shopt -s nullglob
                  installers=("$bundle"/*.exe)
                  archives=("$bundle"/*.nsis.zip)
                  shopt -u nullglob

                  if [ ${#installers[@]} -eq 0 ]; then
                      echo "The bundler produced no installer." >&2
                      exit 1
                  fi
                  assets=("${installers[0]}")

                  # `latest.json` is what an installed app polls. It has to name
                  # the signed archive by URL, so it is only written when the
                  # build was signed.
                  if [ ${#archives[@]} -gt 0 ] && [ -f "${archives[0]}.sig" ]; then
                      archive="${archives[0]}"
                      encoded=$(node -p 'encodeURIComponent(process.argv[1])' "$(basename "$archive")")
                      VERSION="$version" \
                      URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${encoded}" \
                      SIGNATURE="$(cat "${archive}.sig")" \
                      NOTES_FILE="$RUNNER_TEMP/section.md" \
                      LATEST_JSON="$RUNNER_TEMP/latest.json" \
                      node -e '
                          const fs = require("node:fs");
                          const notes = fs.existsSync(process.env.NOTES_FILE)
                              ? fs.readFileSync(process.env.NOTES_FILE, "utf8").trim()
                              : "";
                          const manifest = {
                              version: process.env.VERSION,
                              notes,
                              pub_date: new Date().toISOString(),
                              platforms: {
                                  "windows-x86_64": {
                                      signature: process.env.SIGNATURE,
                                      url: process.env.URL,
                                  },
                              },
                          };
                          fs.writeFileSync(process.env.LATEST_JSON, `${JSON.stringify(manifest, null, 2)}\n`);
                      '
                      assets+=("$archive" "${archive}.sig" "$RUNNER_TEMP/latest.json")
                  else
                      echo "No signed updater archive was produced, so latest.json was not written and this release will not be offered as an update." >> "$GITHUB_STEP_SUMMARY"
                  fi

                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release upload "$tag" "${assets[@]}" --clobber
                  else
                      gh release create "$tag" "${assets[@]}" \
                          --title "$title" \
                          --notes-file "$RUNNER_TEMP/release-notes.md"
                  fi
